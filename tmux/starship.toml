"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false


# Styling is emitted as literal tmux `#[...]` directives because the tmux status
# line does not interpret the ANSI escapes that starship's own styles would produce.
format = """
#\\[bg=colour7,fg=colour0\\]\
$time\
#\\[fg=colour7,bg=colour8,nobold,nounderscore,noitalics\\]#\\[fg=colour7\\]\
${custom.tmux-session}\
#\\[fg=colour8,bg=colour0,nobold,nounderscore,noitalics\\]#\\[fg=colour16,bold\\]\
$hostname
"""

right_format = """
#\\[fg=colour8\\]#\\[fg=colour7,bg=colour8\\]\
(${git_status})(${git_state})${git_branch}\
(\
#\\[fg=colour2\\]#\\[fg=colour0,bg=colour2\\]\
${custom.tmux-pane-pixi}\
)\
"""

[time]
disabled = false
format = "$time"
time_format = "  %a%e   %R "

[hostname]
disabled = false
format = " $ssh_symbol$hostname "
ssh_only = true
ssh_symbol = " "

[custom.tmux-session]
disabled = false
description = "The current tmux session"
command = "tmux display-message -p '#S'"
when = true
format = " $symbol$output "
symbol = " "

[git_branch]
disabled = false
format = " $symbol$branch(:$remote_name/$remote_branch) "
symbol = " "

[git_state]
disabled = false
format = " $state( $progress_current/$progress_total) "

[git_status]
disabled = false
format = """
( \
(($conflicted )($deleted )($renamed )($modified )($typechanged )($staged )($untracked ) )\
($stashed  )\
($ahead_behind ))\
"""
ahead = "$count"
behind = "$count"
diverged = "$ahead_count $behind_count"
up_to_date = "󰄭"
conflicted = "✘$count"
untracked = "…"
modified = "~$count"
deleted = "-$count"
staged = "●$count"
renamed = "»$count"
stashed = " $count"

[custom.tmux-pane-pixi]
disabled = false
description = ""
command = """
pixi info --json | jq --raw-output '.environments_info | map(.name) | join("|")'
"""
detect_files = ["pixi.lock"]
format = " $symbol$output "
symbol = " "

